# Desktop Friends backend. Settings come from environment variables; when running locally with Maven they
# can also live in backend/.env (KEY=value lines, see .env.example), which is imported below.
spring:
  application:
    name: desktop-friends-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # Supabase → Connect → "Session pooler" (works over IPv4), as a JDBC URL:
    # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    # The schema is owned by supabase/migrations; never let Hibernate change it.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  # nginx sits in front and sets X-Forwarded-* headers.
  forward-headers-strategy: framework
  shutdown: graceful

app:
  supabase:
    url: ${SUPABASE_URL}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
  cors:
    # The Vite dev server, and the packaged Electron app (file:// pages send "file://" or "null").
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,file://,null}

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
